# Desarrollo local. Un solo comando:  docker compose up   (o:  pnpm dev)
# No necesitas crear .env: todo trae valores por defecto que funcionan.
# Si quieres cambiar algo (ej. usar Supabase o un puerto ocupado), copia .env.example a .env.

x-dev-service: &dev-service
  build:
    context: ./docker
    dockerfile: Dockerfile.dev
  working_dir: /app
  env_file:
    - path: .env
      required: false
  volumes:
    - .:/app
    - root_node_modules:/app/node_modules
    - api_node_modules:/app/apps/api/node_modules
    - web_node_modules:/app/apps/web/node_modules
    - shared_node_modules:/app/packages/shared/node_modules
    - pnpm_store:/pnpm-store

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: alquiler
      POSTGRES_PASSWORD: alquiler
      POSTGRES_DB: alquiler
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alquiler -d alquiler"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025" # bandeja de correos: http://localhost:8026
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP, para correr el API fuera de Docker (apps/api/.env)

  # Instala dependencias y compila @app/shared una sola vez antes de arrancar api/web.
  install:
    <<: *dev-service
    command: sh -c "pnpm config set store-dir /pnpm-store && pnpm install --frozen-lockfile && pnpm --filter @app/shared build && pnpm --filter @app/api prisma:generate"
    restart: "no"

  # Recompila @app/shared cuando cambias enums/tipos compartidos.
  shared:
    <<: *dev-service
    command: pnpm --filter @app/shared dev
    depends_on:
      install:
        condition: service_completed_successfully

  api:
    <<: *dev-service
    # Aplica las migraciones pendientes (deploy), carga datos de ejemplo (solo si la base esta vacia) y arranca en modo watch.
    command: sh -c "pnpm --filter @app/api prisma:migrate && pnpm --filter @app/api prisma:seed && pnpm --filter @app/api start:dev"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://alquiler:alquiler@db:5432/alquiler}
      DIRECT_URL: ${DIRECT_URL:-postgresql://alquiler:alquiler@db:5432/alquiler}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Cache y rate limit compartidos entre servidores
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-0123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-0123456789}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Base de los enlaces a /uploads (fotos); con un tunel debe ser la URL publica del API
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully

  web:
    <<: *dev-service
    command: pnpm --filter @app/web dev
    volumes:
      # La cache de compilacion de Next (~1 GB) vive en un volumen de Docker, no en la carpeta del proyecto
      # (que esta en OneDrive): no ocupa espacio en el disco del proyecto ni se sincroniza.
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - pnpm_store:/pnpm-store
      - web_next:/app/apps/web/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://api:3001
      # Datos reales del API (la base se siembra sola). auto = datos de ejemplo si el API no responde.
      NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      install:
        condition: service_completed_successfully

volumes:
  db_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  pnpm_store:
  web_next:
