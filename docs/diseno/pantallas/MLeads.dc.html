<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil leads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:700;font-size:13px;white-space:nowrap;transition:all .18s}
.chip .n{min-width:24px;height:22px;padding:0 6px;border-radius:11px;background:var(--surf2);font-size:12px;font-weight:800;display:grid;place-items:center}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.on .n{background:rgba(255,255,255,.25)}
.lead{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--surf);border:1px solid var(--line);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.wa{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:#1F9D55;color:#fff;font-weight:800;font-size:14px}
.mv{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:14px;border:0;background:var(--ac-soft);color:var(--ac-ink);font-weight:800;font-size:13px}
.mv:active,.wa:active{transform:scale(.96)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:700;color:var(--muted)}
.tb.on{color:var(--ac-ink)}
@keyframes rise{
from{opacity:0;transform:translateY(16px)}
to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}
</style>
</helmet>
<div style="{{themeStyle}}; position:relative; width:390px; height:844px; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',system-ui,sans-serif; overflow:hidden">

<header style="flex:0 0 auto; display:flex; flex-direction:column; gap:12px; padding:16px 16px 12px; border-bottom:1px solid var(--line)">
<div style="display:flex; align-items:center; justify-content:space-between"><span style="font-weight:800; font-size:26px; letter-spacing:-0.03em">Leads y citas</span>
<a href="MLeads.dc.html" aria-label="Calendario de visitas" style="width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--surf); display:grid; place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg></a></div>
<div style="display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:0 16px 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}<span class="n">{{t.n}}</span></button></sc-for>
</div>
</header>

<div style="flex:1 1 auto; overflow-y:auto; padding:14px 16px 20px; display:flex; flex-direction:column; gap:12px">
<sc-for list="{{leads}}" as="l" hint-placeholder-count="3">
<article class="lead" style="animation-delay:{{l.delay}}">
<div style="display:flex; align-items:center; gap:12px">
<span style="flex:0 0 46px; height:46px; border-radius:50%; background:{{l.color}}; color:#fff; display:grid; place-items:center; font-weight:800; font-size:15px">{{l.ini}}</span>
<span style="flex:1; min-width:0; display:flex; flex-direction:column"><span style="font-weight:800; font-size:16px">{{l.name}}</span><span style="font-size:12px; color:var(--muted)">{{l.when}} · {{l.ag}}</span></span>
</div>
<div style="display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:14px; background:var(--surf2)"><span style="font-weight:700; font-size:13px">{{l.prop}}</span><span style="font-size:12px; color:var(--muted)">{{l.price}} · {{l.place}}</span></div>
<div style="font-size:14px; line-height:1.45; color:var(--muted)">"{{l.msg}}"</div>
<div style="display:flex; gap:8px">
<a href="MLeads.dc.html" class="wa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 01-13.400 7.800L3 21l1.300-4.400A9 9 0 1121 12z"/></svg>Responder</a>
<button class="mv" onClick="{{l.move}}">{{l.moveLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
</article>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding:40px 20px; border-radius:20px; border:2px dashed var(--line); text-align:center; color:var(--muted); font-weight:600">No hay leads en esta etapa. ¡Buen trabajo!</div>
</sc-if>
</div>

<nav style="flex:0 0 76px; display:flex; align-items:center; padding:0 6px 8px; border-top:1px solid var(--line); background:var(--surf)">
<a href="MPanel.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="5" rx="1.500"/><rect x="14" y="12" width="7" height="9" rx="1.500"/><rect x="3" y="16" width="7" height="5" rx="1.500"/></svg>Resumen</a>
<a href="MInventario.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Propiedades</a>
<a href="MPublicar.dc.html" aria-label="Publicar" style="flex:0 0 58px; height:58px; margin:-18px 6px 0; border-radius:50%; background:var(--ac); color:#fff; display:grid; place-items:center; box-shadow:0 10px 24px color-mix(in srgb, var(--ac) 50%, transparent)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="MLeads.dc.html" class="tb on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 01-13.400 7.800L3 21l1.300-4.400A9 9 0 1121 12z"/></svg>Leads</a>
<a href="MEquipo.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2 21c0-4 3.100-7 7-7s7 3 7 7M17 4.500a3.500 3.500 0 010 7M22 21c0-3.200-2-5.700-5-6.700"/></svg>Equipo</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B4BE8","options":["#2563EB","#5B4BE8","#0E8A5F","#C2410C"],"section":"Marca"},"dark":{"editor":"boolean","default":false,"section":"Marca"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab: 0, at: {} };

  renderVals() {
    const dark = !!this.props.dark;
    const ac = this.props.accent ?? '#5B4BE8';
    const t = dark
      ? { bg: '#0E1117', surf: '#161B24', surf2: '#1D2430', text: '#F3F5F9', muted: '#A3ADBF', line: '#2A3342', ink: 'color-mix(in srgb, ' + ac + ' 55%, white)', soft: 'color-mix(in srgb, ' + ac + ' 22%, #161B24)' }
      : { bg: '#FFFFFF', surf: '#FFFFFF', surf2: '#F4F6FA', text: '#0F1420', muted: '#566073', line: '#E6E9F0', ink: ac, soft: 'color-mix(in srgb, ' + ac + ' 12%, white)' };
    const themeStyle = '--ac:' + ac + ';--ac-ink:' + t.ink + ';--ac-soft:' + t.soft + ';--bg:' + t.bg + ';--surf:' + t.surf + ';--surf2:' + t.surf2 + ';--text:' + t.text + ';--muted:' + t.muted + ';--line:' + t.line;

    const s = this.state;
    const stages = [['Nuevos', 'Marcar contactado'], ['Contactados', 'Agendar visita'], ['Visita', 'Pasar a reserva'], ['Reserva', 'Marcar alquilada']];
    const palette = ['#5B4BE8', '#0E8A5F', '#C2410C', '#2563EB', '#B83280'];
    const base = [
      { id: 1, name: 'Carlos P.', prop: 'Apartamento moderno con vista', price: '$450', place: 'Los Palos Grandes', msg: '¿Sigue disponible? Me interesa visitarlo.', when: 'Hace 12 min', ag: 'Andrea', st: 0 },
      { id: 2, name: 'Daniela R.', prop: 'Estudio amoblado', price: '$320', place: 'Las Mercedes', msg: '¿Incluye internet y condominio?', when: 'Hace 40 min', ag: 'Marta', st: 0 },
      { id: 3, name: 'Jesús M.', prop: 'Penthouse con terraza', price: '$1.800', place: 'Altamira', msg: 'Buenas, ¿aceptan mascotas?', when: 'Hace 2 h', ag: 'Luis', st: 0 },
      { id: 4, name: 'Valentina G.', prop: 'Casa familiar con jardín', price: '$1.200', place: 'La Lagunita', msg: 'Lo converso en casa y te aviso.', when: 'Ayer', ag: 'Andrea', st: 1 },
      { id: 5, name: 'Ricardo S.', prop: 'Apartamento con balcón', price: '$520', place: 'Campo Alegre', msg: '¿Se puede ver el fin de semana?', when: 'Ayer', ag: 'Andrea', st: 1 },
      { id: 6, name: 'Mariana L.', prop: 'Apartamento céntrico', price: '$390', place: 'Chacao', msg: 'Confirmo la visita de hoy.', when: 'Hoy 10:00', ag: 'Marta', st: 2 },
      { id: 7, name: 'Gabriela T.', prop: 'Casa familiar con jardín', price: '$1.200', place: 'La Lagunita', msg: 'Listos para apartar. ¿Cómo hacemos el pago?', when: 'Hace 3 días', ag: 'Andrea', st: 3 }
    ].map((l) => ({ ...l, st: s.at[l.id] !== undefined ? s.at[l.id] : l.st }));

    const tabs = stages.map(([label], i) => ({ label, n: base.filter((l) => l.st === i).length, cls: s.tab === i ? 'chip on' : 'chip', pick: () => this.setState({ tab: i }) }));
    const leads = base.filter((l) => l.st === s.tab).map((l, i) => ({
      ...l, delay: (i * 60) + 'ms',
      ini: l.name.split(' ').map((w) => w[0]).join(''), color: palette[l.id % palette.length],
      moveLabel: stages[s.tab][1],
      move: () => this.setState({ at: { ...s.at, [l.id]: Math.min(4, s.tab + 1) } })
    }));
    return { themeStyle, tabs, leads, empty: leads.length === 0 };
  }
}
</script>
</body>
</html>
