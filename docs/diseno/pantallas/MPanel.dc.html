<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.qa{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;border-radius:20px;border:1px solid var(--line);background:var(--surf);font-weight:800;font-size:12px;text-align:center;transition:transform .18s, border-color .18s}
.qa:active{transform:scale(.95)}
.qa .i{width:42px;height:42px;border-radius:14px;background:var(--ac-soft);color:var(--ac-ink);display:grid;place-items:center}
.qa.main{background:var(--ac);color:#fff;border-color:var(--ac)}
.qa.main .i{background:rgba(255,255,255,.22);color:#fff}
.kpi{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surf);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.todo{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--surf);text-align:left;font-weight:600;font-size:14px;transition:all .2s}
.todo .ck{flex:0 0 28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:all .2s}
.todo.done{color:var(--muted);text-decoration:line-through}
.todo.done .ck{background:var(--ac);border-color:var(--ac);color:#fff}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:700;color:var(--muted)}
.tb.on{color:var(--ac-ink)}
@keyframes rise{
from{opacity:0;transform:translateY(16px)}
to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}
</style>
</helmet>
<div style="{{themeStyle}}; position:relative; width:390px; height:844px; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',system-ui,sans-serif; overflow:hidden">

<header style="flex:0 0 64px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--line)">
<span style="display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; letter-spacing:-0.02em">
<span style="width:34px; height:34px; border-radius:11px; background:var(--ac); display:grid; place-items:center; color:#fff"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>
[NOMBRE]</span>
<button aria-label="Notificaciones" style="position:relative; width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--surf); display:grid; place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.700 21a2 2 0 01-3.400 0"/></svg><span style="position:absolute; top:11px; right:12px; width:9px; height:9px; border-radius:50%; background:var(--ac); border:2px solid var(--surf)"></span></button>
</header>

<div style="flex:1 1 auto; overflow-y:auto; padding:20px 16px 24px; display:flex; flex-direction:column; gap:20px">
<div style="display:flex; flex-direction:column; gap:4px"><span style="font-weight:800; font-size:26px; letter-spacing:-0.03em">Buenos días</span><span style="font-size:15px; color:var(--muted)"><b style="color:var(--text)">7 interesados nuevos</b> y <b style="color:var(--text)">2 visitas</b> hoy.</span></div>

<div style="display:flex; gap:10px">
<a href="MPublicar.dc.html" class="qa main"><span class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Publicar</a>
<a href="MLeads.dc.html" class="qa"><span class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 01-13.400 7.800L3 21l1.300-4.400A9 9 0 1121 12z"/></svg></span>Responder</a>
<a href="MEquipo.dc.html" class="qa"><span class="i"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.600-7 8-7M19 14v6M16 17h6"/></svg></span>Invitar</a>
</div>

<div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div class="kpi" style="animation-delay:{{k.delay}}"><span style="font-size:12px; font-weight:700; color:var(--muted)">{{k.label}}</span><span style="font-weight:800; font-size:32px; letter-spacing:-0.03em; line-height:1.1">{{k.value}}</span><span style="font-size:12px; font-weight:700; color:var(--ac-ink)">{{k.note}}</span></div>
</sc-for>
</div>

<div style="display:flex; flex-direction:column; gap:10px">
<div style="display:flex; align-items:center; justify-content:space-between"><span style="font-weight:800; font-size:18px">Para hoy</span><span style="font-size:13px; font-weight:800; color:var(--ac-ink)">{{doneN}} de 4</span></div>
<sc-for list="{{todos}}" as="t" hint-placeholder-count="4">
<button class="{{t.cls}}" onClick="{{t.toggle}}"><span class="ck"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>{{t.label}}</button>
</sc-for>
</div>
</div>

<nav style="flex:0 0 76px; display:flex; align-items:center; padding:0 6px 8px; border-top:1px solid var(--line); background:var(--surf)">
<a href="MPanel.dc.html" class="tb on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="5" rx="1.500"/><rect x="14" y="12" width="7" height="9" rx="1.500"/><rect x="3" y="16" width="7" height="5" rx="1.500"/></svg>Resumen</a>
<a href="MInventario.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Propiedades</a>
<a href="MPublicar.dc.html" aria-label="Publicar" style="flex:0 0 58px; height:58px; margin:-18px 6px 0; border-radius:50%; background:var(--ac); color:#fff; display:grid; place-items:center; box-shadow:0 10px 24px color-mix(in srgb, var(--ac) 50%, transparent)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="MLeads.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 01-13.400 7.800L3 21l1.300-4.400A9 9 0 1121 12z"/></svg>Leads</a>
<a href="MEquipo.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2 21c0-4 3.100-7 7-7s7 3 7 7M17 4.500a3.500 3.500 0 010 7M22 21c0-3.200-2-5.700-5-6.700"/></svg>Equipo</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B4BE8","options":["#2563EB","#5B4BE8","#0E8A5F","#C2410C"],"section":"Marca"},"dark":{"editor":"boolean","default":false,"section":"Marca"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { done: { 1: true } };

  renderVals() {
    const dark = !!this.props.dark;
    const ac = this.props.accent ?? '#5B4BE8';
    const t = dark
      ? { bg: '#0E1117', surf: '#161B24', surf2: '#1D2430', text: '#F3F5F9', muted: '#A3ADBF', line: '#2A3342', ink: 'color-mix(in srgb, ' + ac + ' 55%, white)', soft: 'color-mix(in srgb, ' + ac + ' 22%, #161B24)' }
      : { bg: '#FFFFFF', surf: '#FFFFFF', surf2: '#F4F6FA', text: '#0F1420', muted: '#566073', line: '#E6E9F0', ink: ac, soft: 'color-mix(in srgb, ' + ac + ' 12%, white)' };
    const themeStyle = '--ac:' + ac + ';--ac-ink:' + t.ink + ';--ac-soft:' + t.soft + ';--bg:' + t.bg + ';--surf:' + t.surf + ';--surf2:' + t.surf2 + ';--text:' + t.text + ';--muted:' + t.muted + ';--line:' + t.line;

    const s = this.state;
    const kpis = [
      { label: 'Propiedades activas', value: '42', note: '3 por vencer' },
      { label: 'Interesados nuevos', value: '7', note: 'Responde pronto' },
      { label: 'Visitas hoy', value: '2', note: '10:00 y 15:30' },
      { label: 'En reserva', value: '5', note: '1 lista para cerrar' }
    ].map((k, i) => ({ ...k, delay: (i * 70) + 'ms' }));
    const defs = ['Responder 7 interesados', 'Confirmar visita de las 10:00', 'Agregar fotos a 5 propiedades', 'Renovar 3 anuncios por vencer'];
    const todos = defs.map((label, i) => ({ label, cls: s.done[i] ? 'todo done' : 'todo', toggle: () => this.setState({ done: { ...s.done, [i]: !s.done[i] } }) }));
    return { themeStyle, kpis, todos, doneN: Object.values(s.done).filter(Boolean).length };
  }
}
</script>
</body>
</html>
