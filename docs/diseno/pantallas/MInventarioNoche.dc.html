<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil inventario noche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:700;font-size:13px;white-space:nowrap;transition:all .18s}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip .n{font-size:12px;opacity:.8}
.pc{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--surf);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.stat{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;border:0;font-weight:800;font-size:13px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);font-weight:700;font-size:13px;transition:transform .15s}
.act:active{transform:scale(.95)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:700;color:var(--muted)}
.tb.on{color:var(--ac-ink)}
@keyframes rise{
from{opacity:0;transform:translateY(16px)}
to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}
</style>
</helmet>
<div style="{{themeStyle}}; position:relative; width:390px; height:844px; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:'Plus Jakarta Sans',system-ui,sans-serif; overflow:hidden">

<header style="flex:0 0 auto; display:flex; flex-direction:column; gap:12px; padding:16px 16px 10px; border-bottom:1px solid var(--line)">
<div style="display:flex; align-items:center; justify-content:space-between"><span style="font-weight:800; font-size:26px; letter-spacing:-0.03em">Propiedades</span><a href="Importar.dc.html" aria-label="Importar desde Excel" style="width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--surf); display:grid; place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg></a></div>
<label style="display:flex; align-items:center; gap:10px; min-height:48px; padding:0 16px; border-radius:999px; background:var(--surf2); border:1px solid var(--line)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg>
<input type="text" placeholder="Buscar por título o código" aria-label="Buscar" style="flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:14px; font-weight:600" />
</label>
<div style="display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:0 16px 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}<span class="n">{{t.n}}</span></button></sc-for>
</div>
</header>

<div style="flex:1 1 auto; overflow-y:auto; padding:14px 16px 20px; display:flex; flex-direction:column; gap:12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<article class="pc" style="animation-delay:{{r.delay}}">
<div style="display:flex; gap:12px">
<span style="{{r.photo}}; flex:0 0 84px; height:84px; border-radius:16px; display:grid; place-items:center; color:var(--ac-ink)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
<span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px">
<span style="font-weight:800; font-size:20px; letter-spacing:-0.02em">{{r.price}}<span style="font-size:12px; font-weight:600; color:var(--muted)"> /mes</span></span>
<span style="font-weight:700; font-size:14px">{{r.title}}</span>
<span style="font-size:12px; color:var(--muted)">{{r.place}} · {{r.code}}</span>
</span>
</div>
<div style="display:flex; align-items:center; justify-content:space-between">
<button class="stat" onClick="{{r.cycle}}" style="{{r.statStyle}}"><span style="width:8px; height:8px; border-radius:50%; background:currentColor"></span>{{r.status}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<span style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--muted)"><span style="width:28px; height:28px; border-radius:50%; background:{{r.agentColor}}; color:#fff; display:grid; place-items:center; font-size:10px; font-weight:800">{{r.ini}}</span>{{r.views}} vistas</span>
</div>
<div style="display:flex; gap:8px">
<a href="MPublicar.dc.html" class="act"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11a2.100 2.100 0 00-3-3L5 16z"/></svg>Editar</a>
<button class="act" style="color:#14633A; background:#E3F4EA; border-color:transparent"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 01-13.400 7.800L3 21l1.300-4.400A9 9 0 1121 12z"/></svg>Compartir</button>
<button class="act" aria-label="Más acciones" style="flex:0 0 46px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="19" cy="12" r="1.800"/></svg></button>
</div>
</article>
</sc-for>
</div>

<nav style="flex:0 0 76px; display:flex; align-items:center; padding:0 6px 8px; border-top:1px solid var(--line); background:var(--surf)">
<a href="MPanel.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.500"/><rect x="14" y="3" width="7" height="5" rx="1.500"/><rect x="14" y="12" width="7" height="9" rx="1.500"/><rect x="3" y="16" width="7" height="5" rx="1.500"/></svg>Resumen</a>
<a href="MInventario.dc.html" class="tb on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Propiedades</a>
<a href="MPublicar.dc.html" aria-label="Publicar" style="flex:0 0 58px; height:58px; margin:-18px 6px 0; border-radius:50%; background:var(--ac); color:#fff; display:grid; place-items:center; box-shadow:0 10px 24px color-mix(in srgb, var(--ac) 50%, transparent)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="MLeads.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 01-13.400 7.800L3 21l1.300-4.400A9 9 0 1121 12z"/></svg>Leads</a>
<a href="MEquipo.dc.html" class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2 21c0-4 3.100-7 7-7s7 3 7 7M17 4.500a3.500 3.500 0 010 7M22 21c0-3.200-2-5.700-5-6.700"/></svg>Equipo</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B4BE8","options":["#2563EB","#5B4BE8","#0E8A5F","#C2410C"],"section":"Marca"},"dark":{"editor":"boolean","default":true,"section":"Marca"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab: 'Todas', st: {} };

  renderVals() {
    const dark = this.props.dark ?? true;
    const ac = this.props.accent ?? '#5B4BE8';
    const t = dark
      ? { bg: '#0E1117', surf: '#161B24', surf2: '#1D2430', text: '#F3F5F9', muted: '#A3ADBF', line: '#2A3342', ink: 'color-mix(in srgb, ' + ac + ' 55%, white)', soft: 'color-mix(in srgb, ' + ac + ' 22%, #161B24)' }
      : { bg: '#FFFFFF', surf: '#FFFFFF', surf2: '#F4F6FA', text: '#0F1420', muted: '#566073', line: '#E6E9F0', ink: ac, soft: 'color-mix(in srgb, ' + ac + ' 12%, white)' };
    const themeStyle = '--ac:' + ac + ';--ac-ink:' + t.ink + ';--ac-soft:' + t.soft + ';--bg:' + t.bg + ';--surf:' + t.surf + ';--surf2:' + t.surf2 + ';--text:' + t.text + ';--muted:' + t.muted + ';--line:' + t.line;

    const s = this.state;
    const order = ['Publicada', 'Reservada', 'Alquilada', 'Pausada'];
    const hue = { Publicada: '#1F9D55', Reservada: '#D98A00', Alquilada: '#6B7488', Pausada: '#D64545' };
    const agents = { An: ac, Lu: '#0E8A5F', Ma: '#C2410C' };
    const base = [
      { id: 1, title: 'Apartamento moderno con vista', code: 'P-1042', place: 'Los Palos Grandes', price: '$450', st: 'Publicada', ag: 'An', views: 412 },
      { id: 2, title: 'Penthouse con terraza', code: 'P-1043', place: 'Altamira', price: '$1.800', st: 'Publicada', ag: 'Lu', views: 358 },
      { id: 3, title: 'Casa familiar con jardín', code: 'P-1038', place: 'La Lagunita', price: '$1.200', st: 'Reservada', ag: 'An', views: 301 },
      { id: 4, title: 'Estudio amoblado', code: 'P-1051', place: 'Las Mercedes', price: '$320', st: 'Publicada', ag: 'Ma', views: 266 },
      { id: 5, title: 'Anexo acogedor y luminoso', code: 'P-1027', place: 'El Cafetal', price: '$280', st: 'Alquilada', ag: 'Lu', views: 190 },
      { id: 6, title: 'Apartamento céntrico', code: 'P-1033', place: 'Chacao', price: '$390', st: 'Pausada', ag: 'Ma', views: 144 }
    ].map((p) => ({ ...p, st: s.st[p.id] || p.st }));
    const counts = { Todas: base.length };
    order.forEach((o) => { counts[o] = base.filter((p) => p.st === o).length; });
    const tabs = ['Todas', ...order].map((label) => ({ label, n: counts[label], cls: s.tab === label ? 'chip on' : 'chip', pick: () => this.setState({ tab: label }) }));
    const rows = base.filter((p) => s.tab === 'Todas' || p.st === s.tab).map((p, i) => {
      const c = hue[p.st];
      return { ...p, status: p.st, ini: p.ag.toUpperCase(), agentColor: agents[p.ag], delay: (i * 50) + 'ms',
        photo: 'background:color-mix(in srgb, var(--ac) ' + (10 + (p.id * 4) % 20) + '%, var(--surf2))',
        statStyle: 'background:color-mix(in srgb, ' + c + ' 16%, var(--surf)); color:color-mix(in srgb, ' + c + ' 75%, var(--text))',
        cycle: () => this.setState({ st: { ...s.st, [p.id]: order[(order.indexOf(p.st) + 1) % order.length] } }) };
    });
    return { themeStyle, tabs, rows };
  }
}
</script>
</body>
</html>
